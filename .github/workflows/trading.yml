name: Bot de Trading Automatique

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write  # Permet au bot de sauvegarder les modifications de portefeuille

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les bibliothèques
        run: |
          pip install --upgrade pip
          pip install requests feedparser pandas yfinance

      - name: Lancer le script de Trading
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python bot_trading.py

      - name: Sauvegarder l'état du portefeuille sur GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add etat.json
          git commit -m "Mise à jour automatique de l'état du portefeuille [skip ci]" || echo "Aucun changement à commiter"
          git push
